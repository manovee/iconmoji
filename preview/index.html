<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="iconmoji — Lightweight Icon & Emoji Picker for React" />
    <meta property="og:description" content="A fast, plug-and-play icon and emoji picker for React and Next.js apps with Lucide support, fuzzy search, and zero bloat." />
    <meta property="og:site_name" content="iconmoji" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://manovee.github.io/iconmoji/" />
    <meta name="twitter:title" content="iconmoji — Lightweight Icon & Emoji Picker for React" />

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>" />
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("iconmoji-preview-theme");
          var theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          var themeBg = theme === "dark" ? "#09111f" : "#f7f1ea";
          document.documentElement.style.backgroundColor = themeBg;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", themeBg);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="../dist/styles.css" />
    <link rel="stylesheet" href="./preview.css" />
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "lucide-react": "https://esm.sh/lucide-react@0.522.0?external=react"
        }
      }
    </script>
